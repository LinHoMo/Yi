name: Yi 云端报告

# 网页 AI / 用户通过以下任一方式触发，runner 在零依赖环境跑 yi，产出 MD+HTML，
# 并通过 Artifact、reports 分支、issue 评论回传。详见 docs/AI-SOP.md。
#
# ⚠️ 表单字段上限：workflow_dispatch 的 inputs **最多 10 个**，超了工作流直接不注册。
# 故表单只暴露 6 个字段（4 个余量）：discipline/question/datetime/gender + 一个
# `extra`（JSON 对象字符串）作为高级字段逃生舱——mode/numbers/way/date/activity/
# yao/hour_branch/direction/longitude/name 都可塞进 extra，由 tools/ci_request.py
# 解析合并。旧版逐字段表单（mode/way/…）仍兼容：显式注入的 INPUT_* 环境变量照常生效。
on:
  workflow_dispatch:
    inputs:
      discipline:
        description: 学科
        type: choice
        options:
          - liuyao
          - ming
          - ziwei
          - meihua
          - xiaoliuren
          - zeji
        default: liuyao
      question:
        description: 求测问题（卜科；命科可留空）
        type: string
        default: ''
      datetime:
        description: '起算/出生时间，格式 YYYY-MM-DD HH:MM（命/紫微必填）'
        type: string
        default: ''
      gender:
        description: 性别（命/紫微用：男 或 女）
        type: string
        default: ''
      extra:
        description: '高级字段（JSON 对象，可选）：{"mode":"coin","numbers":"1,2,3","way":"time","date":"2026-09-30","activity":"开市","yao":"…","hour_branch":"…","direction":"…","longitude":116.4,"name":"…"}'
        type: string
        default: ''
      commit_branch:
        description: '是否提交到 reports 分支(公开可读)。注意: question/datetime/gender 将永久公开,默认关闭'
        type: boolean
        default: false
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [yi-report]

# 回传需要：写 reports 分支（contents）、回写 issue 评论（issues）、
# 读 issue 评论者权限（issues: read 已含在 issues: write）
permissions:
  contents: write
  issues: write
  actions: read
  # 最小权限原则: 仅保留写 reports 分支 + 回评 issue 的权限。
  # 仓库 secrets 不暴露给本工作流(除非显式 declared)。

# 同一 issue / 同一学科串行：连点两次触发不会并行起多个 run 各回一次评论。
# 不取消进行中的（cancel-in-progress: false）——报告是有用产物，跑完比省时间重要。
concurrency:
  group: yi-report-${{ github.event.issue.number || github.event.inputs.discipline || 'misc' }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python（零第三方依赖，不安装包）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验 repository_dispatch 签名(可选安全门)
        id: auth
        if: github.event_name == 'repository_dispatch'
        env:
          YI_DISPATCH_SECRET: ${{ secrets.YI_DISPATCH_SECRET }}
        run: |
          # 若 YI_DISPATCH_SECRET 已设置,则 repository_dispatch 的 client_payload
          # 必须包含同名的 token 字段,否则拒绝执行。未设置则跳过(向后兼容)。
          python - <<'PY'
          import os, json, sys
          secret = os.environ.get("YI_DISPATCH_SECRET", "")
          if not secret:
              print("未设置 YI_DISPATCH_SECRET, 跳过 dispatch 校验(向后兼容)")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("dispatch_authenticated=skip\n")
              sys.exit(0)
          payload = json.loads(os.environ.get("CLIENT_PAYLOAD", "{}"))
          if payload.get("token") != secret:
              print("::error::YI_DISPATCH_SECRET 与 client_payload.token 不匹配,拒绝执行")
              sys.exit(1)
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write("dispatch_authenticated=true\n")
          print("dispatch 签名校验通过")
          PY

      - name: 解析触发请求
        id: req
        if: steps.auth.outcome != 'failure'
        env:
          INPUT_DISCIPLINE: ${{ github.event.inputs.discipline }}
          INPUT_QUESTION: ${{ github.event.inputs.question }}
          INPUT_DATETIME: ${{ github.event.inputs.datetime }}
          INPUT_GENDER: ${{ github.event.inputs.gender }}
          INPUT_EXTRA: ${{ github.event.inputs.extra }}
          INPUT_COMMIT_BRANCH: ${{ github.event.inputs.commit_branch }}
        run: python tools/ci_request.py --out request.json --meta meta.json

      - name: 端到端出报告（chart→analyze→render→HTML）
        if: steps.req.outputs.should_run == 'true'
        run: python tools/report.py --request request.json --outdir out --name report

      - name: 上传 Artifact（MD+HTML）
        if: steps.req.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yi-report
          path: |
            out/report.md
            out/report.html
          if-no-files-found: error

      - name: 提交到 reports 分支（可匿名 raw 读取）
        if: steps.req.outputs.should_run == 'true' && steps.req.outputs.commit_branch == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ci_publish_branch.py --meta meta.json --outdir out

      - name: 回写 issue 评论
        if: steps.req.outputs.should_run == 'true' && steps.req.outputs.has_issue == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ci_deliver.py --meta meta.json --outdir out
