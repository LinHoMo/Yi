# 质量门 CI（184 批建；557 批瘦身为纯备份仓库：只跑两科门 + pytest）。
# - windows-latest 是 cp936 编码红线（[20]/[24]）的验证环境；Linux 侧测不到该靶。
# - fresh checkout 即干净树：gitignored 生成物在 CI 上不存在，两科门禁须靠门内自足夹具跑通。
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 六爻质量门
        run: python liuyao/dev_tools/check.py
      - name: 八字质量门
        run: python bazi/dev_tools/check.py
      - name: pytest
        run: |
          python -m pip install -q pytest
          python -m pytest -q
