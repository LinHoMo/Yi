# 质量门 CI（第一百八十四批·E1）
# 设计要点：
# - fresh checkout 本身就是「干净树」：gitignored 生成物（scratch/、eval_*.json、
#   data/feedback/、logs/）在 CI 上不存在——两科门禁须靠门内自足夹具跑通
#   （liuyao 第一百七十六批、bazi 第一百八十四批的修复路径）。
# - windows-latest：本项目「cp936 行为面」编码红线（[20]/[24]）的开发与验证环境
#   就是 Windows 控制台；在 Linux runner 上这些门测不到它们的原始靶。
# - 本地验证状态（如实）：git worktree 全新检出实跑两科 check.py rc=0
#   （Python 3.14.7 / Windows）。GitHub runner 结果以首次运行定夺；若与本地
#   结论不一致，按 §六.3 以实跑读数更正本文件与 CHANGELOG，不反向「调 CI 凑绿」。
name: quality-gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: bazi quality gate (fresh tree)
        run: python bazi/dev_tools/check.py
      - name: liuyao quality gate (fresh tree)
        run: python liuyao/dev_tools/check.py
