# 质量门 CI（184 批建；277 批补 plugin-gates）。
# - fresh checkout 即干净树：gitignored 生成物在 CI 上不存在，两科门禁须靠门内自足夹具跑通。
# - windows-latest 是 cp936 编码红线（[20]/[24]）的验证环境；Linux 侧测不到该靶。
# - 插件三连：build → selftest（含 [1.6] 产物全量同源）→ verify-in-dsh；
#   ubuntu 侧无 DSH 运行时，落到 PATH 的 python/python3，红则修插件、不跳过不豁免。
# - 本地与 runner 读数不一致时按 §六.3 以实跑读数更正文档，不调 CI 凑绿。
name: quality-gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  root-gates:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: root gates
        run: |
          python devkit/sync_devkit.py --check
          python devkit/root/check_root_docs.py
          python devkit/root/check_root_docs.py --selftest
          python devkit/root/check_docs_index.py
          python devkit/root/check_docs_index.py --selftest
          python devkit/root/check_batch_num.py --selftest
          python devkit/root/check_pytest_bridge.py
          python devkit/root/check_pytest_bridge.py --selftest
          python liuyao/dev_tools/governance_map.py --selftest
          # 525 批：简报同源复验此前从未挂线（tier=nightly、check.py/CI 都没有），补在根级门侧
          python liuyao/dev_tools/adjudication_brief.py --selftest
          # 533 批：G12/G13「声明↔数据」只读对账，闭环曾漂移缺口（守 528 约定，不新增 check.py 门号）
          python liuyao/dev_tools/adjudication_brief.py --reconcile
          python bazi/dev_tools/cross_version_collate.py --reconcile
          python bazi/dev_tools/diff_siku_sanming.py --reconcile
          # 534 批：C1 轻门——主应期 top-k 声明↔数据对账（闭环主应期文本漂移缺口，守 528 约定）
          python liuyao/dev_tools/window_report.py --reconcile
          # 535 批：B 轻门——两份学科 README 关键数字（对齐分/top-1/n/维度）↔ readout_ledger 真值对账
          # （闭环 README 漏回流缺口，守 528 约定不新增 check.py 门号，仿 C1/G12/G13 挂 CI root-gates）
          python liuyao/dev_tools/readme_reconcile.py
          # 537 批：静卦增强回归守卫（536 缺陷态＝enhance_reading 静默缺失致增强段全空）挂 CI root-gates，守 528 约定
          python liuyao/dev_tools/static_enhancement_guard.py --selftest
          python liuyao/dev_tools/static_enhancement_guard.py
          # 540 批：象层现代白话问法词表常驻判据（词表被删时评分门全绿，属静默退化面；守 528 约定挂 CI 不新增 check.py 门号）
          python liuyao/dev_tools/xiang_coverage.py --probe
  # 对外声明 Python 3.10+：本 job 在最低版跑两科冒烟、两科古籍回归与单测。
  # 六爻回归实跑 19/19、思维链 12/12，旧的「17/19 待裁」排除理由已失效。
  min-python-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: declared minimum python smoke
        run: |
          python bazi/tests/smoke_test.py
          python bazi/tests/regression_test.py
          python liuyao/tests/smoke_test.py
          python liuyao/tests/six_god_wang_shuai_test.py
          python liuyao/tests/regression_test.py
          python liuyao/tests/thinking_chain_tests.py
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: bazi quality gate (fresh tree)
        run: python bazi/dev_tools/check.py
      - name: liuyao quality gate (fresh tree)
        run: python liuyao/dev_tools/check.py
  # 第五百二十批建、第五百二十二批收敛清单真源：pytest 运行器
  # （根 conftest 的 collect_ignore + 根 bridge_test.py 子进程桥接 + 原生 six_god 直接收集）
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install dev deps
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest
  # full 账台（quick 会跳过 stale 期望，不作数）
  ledger:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: readout ledger (full)
        run: python liuyao/dev_tools/readout_ledger.py
  kernel-sync:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: kernel single source
        run: |
          python kernel/sync_kernel.py --check
          python devkit/sync_devkit.py --check
  plugin-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build once, distribute to DSH
        run: node plugins/scripts/build.mjs
      - name: shared runtime selftest
        run: node plugins/scripts/selftest.mjs
      - name: dsh full check (build + selftest + verify-in-dsh)
        run: npm --prefix dsh-plugin run check
      - name: dsh manifest assertion
        run: |
          node -e "const fs=require('fs');const must=['package.json','src/index.mjs','SKILL.md','engine','skills/yi-divination/SKILL.md'];const miss=must.filter(p=>!fs.existsSync('dsh-plugin/'+p));if(miss.length){console.error('dsh missing: '+miss.join(', '));process.exit(1)}console.log('dsh manifest ok')"
