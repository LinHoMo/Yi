# 质量门 CI（第一百八十四批·E1；第二百七十七批增 plugin-gates job）
# 设计要点：
# - fresh checkout 本身就是「干净树」：gitignored 生成物（scratch/、eval_*.json、
#   data/feedback/、logs/）在 CI 上不存在——两科门禁须靠门内自足夹具跑通
#   （liuyao 第一百七十六批、bazi 第一百八十四批的修复路径）。
# - windows-latest：本项目「cp936 行为面」编码红线（[20]/[24]）的开发与验证环境
#   就是 Windows 控制台；在 Linux runner 上这些门测不到它们的原始靶。
# - 本地验证状态（如实）：git worktree 全新检出实跑两科 check.py rc=0
#   （Python 3.14.7 / Windows）。GitHub runner 结果以首次运行定夺；若与本地
#   结论不一致，按 §六.3 以实跑读数更正本文件与 CHANGELOG，不反向「调 CI 凑绿」。
# - 277 批：插件三连门（build→selftest→verify-in-dsh）补进 CI。ubuntu 侧是
#   src/python.mjs 双平台解析的**首次实测**——runner 上无 DSH 自带运行时、
#   无 DSH_PYTHON，只能落到 PATH 的 python/python3；红则修插件，不跳过不豁免。
name: quality-gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  root-gates:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: root gates
        run: |
          python devkit/sync_devkit.py --check
          python devkit/root/check_root_docs.py
          python devkit/root/check_docs_index.py
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: bazi quality gate (fresh tree)
        run: python bazi/dev_tools/check.py
      - name: liuyao quality gate (fresh tree)
        run: python liuyao/dev_tools/check.py
  # 344 批：full 账台进 CI。此前只有本地 quick（跳过 6 项）被当「全账」，
  # 实际 full 的 stale 期望（baseline/pattern）长期无人拦；本 job 跑默认 full。
  ledger:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: readout ledger (full)
        run: python liuyao/dev_tools/readout_ledger.py
  kernel-sync:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: kernel single source
        run: |
          python kernel/sync_kernel.py --check
          python devkit/sync_devkit.py --check
  plugin-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        host: [dsh, claude, codex, gemini, yan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 与 DSH 自带运行时同代（3.12.14）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build once, distribute to all adapters
        run: node plugins/scripts/build.mjs
      - name: shared runtime selftest
        run: node plugins/scripts/selftest.mjs
      - name: dsh full check (build + selftest + verify-in-dsh)
        if: matrix.host == 'dsh'
        run: npm --prefix dsh-plugin run check
      - name: host manifest assertion
        env:
          HOST: ${{ matrix.host }}
        run: |
          node -e "const fs=require('fs');const H=process.env.HOST;const must={dsh:['package.json','src/index.mjs','SKILL.md'],claude:['.claude-plugin/plugin.json','.mcp.json','src/server.mjs'],codex:['.codex-plugin/plugin.json','.mcp.json','src/server.mjs'],gemini:['gemini-extension.json','GEMINI.md','src/server.mjs'],yan:['yan-plugin.json','INSTRUCTIONS.md','src/server.mjs','skills/yi-divination/SKILL.md']};const dir={dsh:'dsh-plugin',claude:'claude-plugin',codex:'codex-plugin',gemini:'gemini-plugin',yan:'yan-plugin'}[H];const miss=must[H].filter(p=>!fs.existsSync(dir+'/'+p));if(miss.length){console.error(H+' missing: '+miss.join(', '));process.exit(1)}console.log(H+' manifest ok')"
