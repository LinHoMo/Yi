# 质量门 CI（184 批建；557 批瘦身为纯备份仓库：只跑两科门 + pytest）。
# - windows-latest 是 cp936 编码红线（[20]/[24]）的验证环境；Linux 侧测不到该靶。
# - fresh checkout 即干净树：gitignored 生成物在 CI 上不存在，两科门禁须靠门内自足夹具跑通。
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 六爻质量门
        run: python liuyao/dev_tools/check.py
      - name: 八字质量门
        run: python bazi/dev_tools/check.py
      - name: 候选池复验（只读；558 批 root-gates 下线后改由本工作流直呼）
        run: |
          python liuyao/dev_tools/verify_yilin_candidates.py
          python liuyao/dev_tools/verify_bushi_candidates.py
          python liuyao/dev_tools/verify_bushi_paiyan_candidates.py
          python liuyao/dev_tools/open_yilin_candidates.py --verify
          python liuyao/dev_tools/open_bushi_candidates.py --verify
          python bazi/dev_tools/mine_dts_candidates.py --check
          python bazi/dev_tools/verify_dts_candidates.py
          python bazi/dev_tools/mine_shenfeng_candidates.py --check
          python bazi/dev_tools/verify_shenfeng_candidates.py
          python bazi/dev_tools/open_candidate_pools.py --verify
          python bazi/dev_tools/build_dts_manual_candidates.py --check
          python bazi/dev_tools/verify_dts_manual_candidates.py
          python bazi/dev_tools/book_strength_probe.py --selftest
          python liuyao/dev_tools/build_bushi_yingqi_candidates.py --check
          python liuyao/dev_tools/verify_bushi_yingqi_candidates.py
          python liuyao/dev_tools/open_bushi_yingqi_candidates.py --verify
      - name: pytest
        run: |
          python -m pip install -q pytest
          python -m pytest -q
