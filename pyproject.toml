# 易 · 内核包。学科（六爻等）以脚本方式运行，不各自发版。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yishu-core"
dynamic = ["version"]          # 唯一真值源：core/yishu_core/__init__.py::__version__
description = "易的内核：干支历、节气、纳甲、象数基元、评测与报告，供命卜各学科共用"
requires-python = ">=3.10"
dependencies = []              # 主计算只用标准库；历法自行求节气，不依赖近似表

[project.scripts]
yi = "cli.main:main"

# 可选：装了仅用作历法交叉校验，不装绝不降级为近似算法
[project.optional-dependencies]
lunar = ["lunar-python>=1.4"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8"]            # 仅质量门 [8] 与 tests/ 需要；主计算与出报告不用

[tool.setuptools.dynamic]
version = { attr = "yishu_core.__version__" }

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core", "."]
include = ["yishu_core*", "cli*"]

# 测试：切到 importlib 导入模式，避免仓库内同名脚本（disciplines/*/scripts/smoke_test.py、
# 多个同名的 evaluate.py）在 prepend 模式下互相遮蔽/撞车；testpaths 只收真正的测试套件，
# 不碰被各学科 check.py 以子进程按路径调用的 smoke_test.py。
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
