<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>六爻纳甲预测系统 · 交互门户</title>
<style>
:root{
  --ink:#1C1917;
  --paper:#F6F1E7;
  --paper-2:#EFE7D8;
  --cinnabar:#C45C26;
  --jade:#2F6F5E;
  --rouge:#B33A3A;
  --gold:#B8963E;
  --muted:#8A8175;
  --line:#D9CFBC;
  --card:#FFFBF3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  line-height:1.7;min-height:100%}
body{padding:20px 16px 48px}
.serif{font-family:"Noto Serif SC","Songti SC","SimSun",Georgia,serif}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.wrap{max-width:1120px;margin:0 auto}

/* instrument bar */
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;
  border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:14px 18px;margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:10px}
.seal{
  width:36px;height:36px;border-radius:6px;background:var(--cinnabar);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;
  letter-spacing:1px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)
}
.brand h1{font-size:18px;font-weight:600;letter-spacing:2px}
.brand p{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.metric-pill{
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:12px;color:var(--muted);background:var(--paper)
}
.metric-pill b{color:var(--jade);font-size:16px;margin-left:6px;font-family:Consolas,monospace}

/* case chips */
.cases{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s
}
.chip:hover{border-color:var(--cinnabar)}
.chip:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .v{margin-left:6px;color:var(--muted);font-family:Consolas,monospace;font-size:12px}
.chip.active .v{color:#E8D9A8}

/* layout */
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px 18px 16px
}
.card h2{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  font-size:15px;font-weight:600;letter-spacing:1px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px
}
.card h2::before{
  content:"";width:8px;height:8px;border-radius:2px;background:var(--cinnabar)
}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
.meta .k{color:var(--muted)}
.meta .v{font-weight:500}
@media (max-width:520px){.meta{grid-template-columns:1fr}}

.hex-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hex-box{min-width:160px}
.hex-name{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:28px;letter-spacing:4px}
.hex-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.lines{display:flex;flex-direction:column-reverse;gap:6px;margin-top:8px}
.line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{display:flex;gap:6px;width:72px}
.bar i{display:block;height:8px;border-radius:2px;background:var(--ink)}
.bar.yang i{width:72px}
.bar.yin i{width:30px}
.line.moving .bar i{background:var(--cinnabar)}
.line .tag{font-family:Consolas,monospace}

.verdict-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
.badge{
  display:inline-flex;align-items:center;gap:8px;border-radius:999px;
  padding:6px 14px;font-weight:600;font-size:14px;color:#fff
}
.badge.ji{background:linear-gradient(135deg,#2F6F5E,#1f4d41)}
.badge.xiong{background:linear-gradient(135deg,#B33A3A,#7a2424)}
.badge.ping{background:linear-gradient(135deg,#B8963E,#8a6d28)}
.score{font-family:Consolas,monospace;font-size:13px;color:var(--muted)}

.headline{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  font-size:20px;line-height:1.45;margin-bottom:10px
}
.plain{font-size:14.5px;margin-bottom:10px}
.sec-title{font-size:12px;color:var(--muted);letter-spacing:2px;margin:14px 0 6px;text-transform:none}
.advice{padding-left:18px}
.advice li{margin:4px 0;font-size:14px}
.caveat{margin-top:14px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* thinking chain */
.chain{border-left:2px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.step{position:relative}
.step .idx{
  position:absolute;left:-34px;top:2px;width:24px;height:24px;border-radius:50%;
  background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;
  font-family:Consolas,monospace;font-size:11px;color:var(--muted)
}
.step.pattern .idx{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.step.synthesis .idx{background:var(--jade);border-color:var(--jade);color:#fff}
.step p{font-size:13px;color:#3a342e}
.step .lab{font-family:Consolas,monospace;font-size:11px;color:var(--cinnabar);margin-bottom:2px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{
  border:1px solid var(--line);background:var(--paper);border-radius:6px;
  padding:3px 8px;font-size:12px;color:#4a433a
}

/* blind panel */
.blind-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
@media (max-width:700px){.blind-grid{grid-template-columns:repeat(4,1fr)}}
.bcell{
  border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;
  background:var(--paper)
}
.bcell .id{font-family:Consolas,monospace;font-size:11px;color:var(--muted)}
.bcell .sc{font-family:Consolas,monospace;font-size:16px;font-weight:700;color:var(--jade)}
.hist{display:flex;align-items:flex-end;gap:14px;height:90px;margin-top:12px;padding:0 8px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hist .barh{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--cinnabar),#8a3d18);min-height:4px}
.hist .lbl{font-size:11px;color:var(--muted)}
.hist .val{font-family:Consolas,monospace;font-size:12px}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{opacity:.9}
.btn:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}

.note{
  margin-top:18px;font-size:12px;color:var(--muted);
  border-left:3px solid var(--gold);padding:8px 12px;background:rgba(184,150,62,.08)
}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}

@media (prefers-reduced-motion: no-preference){
  .chip,.btn{transition:all .15s ease}
  .step{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="seal serif">爻</div>
      <div>
        <h1 class="serif">六爻纳甲预测系统</h1>
        <p>代码排盘 · 五步思维链 · 解读 · HTML 导出</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="metric-pill">古籍对齐分<b id="avgScore">—</b><span id="avgScope" style="font-weight:400;color:var(--muted)"></span></div>
    <div class="metric-pill">版本<b style="color:var(--cinnabar)" id="portalVersion">—</b></div>
  </header>

  <div class="cases" id="caseChips" role="tablist" aria-label="案例选择"></div>

  <div class="grid">
    <section class="card">
      <h2>卦盘与关键位</h2>
      <div class="meta" id="metaBox"></div>
      <div class="hex-row" style="margin-top:16px">
        <div class="hex-box">
          <div class="hex-name" id="hexName">—</div>
          <div class="hex-sub" id="hexSub">—</div>
          <div class="lines" id="hexLines"></div>
        </div>
        <div class="hex-box" id="changedBox">
          <div class="hex-name" id="chgName" style="font-size:22px;color:var(--cinnabar)">—</div>
          <div class="hex-sub">变卦</div>
          <div class="lines" id="chgLines"></div>
        </div>
      </div>
      <div class="verdict-row">
        <span class="badge ping" id="verdictBadge">—</span>
        <span class="score" id="scoreText"></span>
      </div>
      <div class="sec-title">格局标签</div>
      <div class="tags" id="tagBox"></div>
    </section>

    <section class="card">
      <h2>解读</h2>
      <div class="headline" id="humanHeadline">—</div>
      <div class="plain" id="humanPlain"></div>
      <div class="sec-title">更直白一点</div>
      <div class="plain" id="humanMeaning"></div>
      <div class="sec-title">时间节奏</div>
      <div class="plain" id="humanTiming"></div>
      <div class="sec-title">可以怎么做</div>
      <ul class="advice" id="humanAdvice"></ul>
      <div class="caveat" id="humanCaveat"></div>
    </section>

    <section class="card" style="grid-column:1/-1">
      <h2>推演过程（备查）</h2>
      <div class="chain" id="chainBox"></div>
    </section>

    <section class="card" style="grid-column:1/-1">
      <h2>盲评看板 · 古典案例库</h2>
      <div class="plain" id="blindNote"></div>
      <div class="plain" id="yingqiStat" style="color:var(--cinnabar)"></div>
      <div class="hist" id="blindHist"></div>
      <div class="sec-title">各案例得分</div>
      <div class="blind-grid" id="blindGrid"></div>
      <div class="actions">
        <button class="btn" id="btnExport">导出当前案例 HTML</button>
        <button class="btn ghost" id="btnOpenSample">打开完整样例报告</button>
        <button class="btn ghost" id="btnCopyHuman">复制解读</button>
      </div>
    </section>
  </div>

  <div class="note" id="metricNote"></div>
  <footer>装卦由引擎自动完成 · 推演过程可备查 · 正文为统一撰写</footer>
</div>

<script>
(function(){
  const data = JSON.parse(document.getElementById('portal-data').textContent);
  const samples = data.samples || [];
  let current = samples[0];

  function badgeClass(v){
    if(!v) return 'ping';
    if(String(v).includes('凶') || String(v).includes('跌')) return 'xiong';
    if(String(v).includes('吉') && !String(v).includes('凶')) return 'ji';
    return 'ping';
  }

  function renderLines(el, yaoLines, changedLines){
    // 卦盘用 SVG 画：爻线（阳连阴断）、纳甲干支、六亲、六神、世应、动爻○×、旬空、变出之支。
    // 原先是 CSS 色条，只能看出阴阳，六神与"动之变"全丢了——卦盘就是这类产品的界面本身。
    const ROW=30, TOP=20, W=420;
    const lines=[...(yaoLines||[])].sort((a,b)=>b.position-a.position);
    const chg={}; (changedLines||[]).forEach(y=>{ chg[y.position]=y; });
    const esc=escapeHtml;
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${TOP+lines.length*ROW+8}" width="100%" role="img" aria-label="卦盘">`;
    if(lines.length){
      svg+=`<g font-size="11" fill="#8a8175" font-family="'Microsoft YaHei',sans-serif">`
         +`<text x="4" y="13">六神</text><text x="54" y="13">六亲</text>`
         +`<text x="104" y="13">纳甲</text><text x="150" y="13">爻象</text>`
         +`<text x="286" y="13">世应</text><text x="330" y="13">变出</text></g>`;
    }
    lines.forEach((y,i)=>{
      const cy=TOP+i*ROW+ROW/2;
      const yang=(y.nature||'')==='yang';
      const mv=!!y.is_moving;
      const ink=mv?'#b3401f':'#2b2620';
      svg+=`<g font-family="'Microsoft YaHei',sans-serif">`;
      svg+=`<text x="4" y="${cy+4}" font-size="11" fill="#8a8175">${esc(y.six_spirit||'')}</text>`;
      svg+=`<text x="54" y="${cy+4}" font-size="12" fill="#4a433a">${esc(y.six_relation||'')}</text>`;
      svg+=`<text x="104" y="${cy+4}" font-size="11" fill="#8a8175">${esc(y.heavenly_stem||'')}</text>`;
      svg+=`<text x="120" y="${cy+4}" font-size="14" font-weight="600" fill="${ink}">${esc(y.earthly_branch||'')}</text>`;
      if(yang){
        svg+=`<rect x="150" y="${cy-4}" width="116" height="8" rx="2" fill="${ink}"/>`;
      }else{
        svg+=`<rect x="150" y="${cy-4}" width="53" height="8" rx="2" fill="${ink}"/>`
           +`<rect x="213" y="${cy-4}" width="53" height="8" rx="2" fill="${ink}"/>`;
      }
      let marks='';
      if(mv) marks+= yang ? '○' : '×';
      if(y.is_empty) marks+=(marks?' ':'')+'空';
      if(marks) svg+=`<text x="272" y="${cy+4}" font-size="11" fill="#b3401f">${esc(marks)}</text>`;
      if(y.is_world) svg+=`<text x="286" y="${cy+4}" font-size="12" font-weight="700" fill="#b3401f">世</text>`;
      else if(y.is_response) svg+=`<text x="286" y="${cy+4}" font-size="12" fill="#4a433a">应</text>`;
      if(mv && y.changed_branch) svg+=`<text x="330" y="${cy+4}" font-size="12" fill="#4a433a">→${esc(y.changed_branch)} ${esc(y.changed_six_relation||'')}</text>`;
      svg+=`<title>${esc([y.name, y.six_relation, (y.heavenly_stem||'')+(y.earthly_branch||''), y.six_spirit,
             y.is_world?'持世':(y.is_response?'应位':''), mv?'动爻':'', y.is_empty?'旬空':''].filter(Boolean).join(' · '))}</title>`;
      svg+=`</g>`;
    });
    svg+=`</svg>`;
    el.innerHTML = lines.length ? svg : '<div class="muted">无爻线数据</div>';
  }

  function extractTags(chain){
    const tags=[];
    (chain||[]).forEach(line=>{
      if(typeof line==='string' && line.includes('[格局要点]')){
        line.replace('[格局要点]','').split(/[、|]/).forEach(t=>{
          t=t.trim();
          if(t && !tags.includes(t) && !t.startsWith('格局-')) tags.push(t);
        });
      }
    });
    return tags.slice(0,12);
  }

  function chainSteps(sample){
    const rc = sample.reasoning_chain || [];
    const steps=[];
    rc.forEach(line=>{
      if(typeof line!=='string') return;
      const m=line.match(/^\[([^\]]+)\]\s*(.*)$/);
      if(!m) return;
      const lab=m[1], body=m[2];
      if(lab==='格局'||lab==='格局要点'){
        steps.push({lab:'格局', body:lab==='格局要点'?body:'', kind:'pattern'});
      } else if(lab==='综合'){
        steps.push({lab:'综合', body, kind:'synthesis'});
      } else {
        steps.push({lab, body, kind:''});
      }
    });
    // ensure 5 classical steps labels
    const wanted=['观局','定用','断旺','察变','综合'];
    const have=new Set(steps.map(s=>s.lab));
    wanted.forEach(w=>{ if(!have.has(w)) steps.unshift({lab:w,body:'（本步数据见引擎 JSON）',kind:w==='综合'?'synthesis':''}); });
    return steps;
  }

  function render(sample){
    current=sample;
    document.querySelectorAll('.chip').forEach(c=>{
      c.classList.toggle('active', c.dataset.id===sample.id);
    });

    const t=sample.time||{};
    document.getElementById('metaBox').innerHTML = [
      ['案例', sample.id],
      ['问题', sample.question||''],
      ['卦宫', (sample.palace||'')+' · '+(sample.generation||'')],
      ['干支', `${t.year_stem_branch||''}年 ${t.month_stem_branch||''}月 ${t.day_stem_branch||''}日`],
      ['旬空', (sample.empty||[]).join('、')||'无'],
      ['用神', (sample.use_god?.category||'')+' @ '+(sample.use_god?.branch||'')+' · '+(sample.use_god?.strength_plain||sample.use_god?.strength||'')],
    ].map(([k,v])=>`<div><span class="k">${k}：</span><span class="v">${escapeHtml(String(v))}</span></div>`).join('');

    document.getElementById('hexName').textContent=sample.hexagram||'—';
    document.getElementById('hexSub').textContent=(sample.palace||'')+'宫 · '+(sample.generation||'');
    renderLines(document.getElementById('hexLines'), sample.yao_lines, sample.changed_yao_lines);

    const chg=sample.changed||'';
    document.getElementById('chgName').textContent=chg||'（静卦）';
    // 变卦栏：列出动爻化出何支何六亲（变爻六亲以主卦宫论，不另起一盘）
    const chgEl=document.getElementById('chgLines');
    const moves=(sample.yao_lines||[]).filter(y=>y.is_moving);
    chgEl.innerHTML = moves.length
      ? moves.map(y=>`<div class="line"><span class="tag">${escapeHtml(y.name||('第'+y.position+'爻'))} `
          +`${escapeHtml(y.earthly_branch||'')} → ${escapeHtml(y.changed_branch||'?')} `
          +`${escapeHtml(y.changed_six_relation||'')}</span></div>`).join('')
      : '<div style="font-size:12px;color:var(--muted)">卦安静，无变卦</div>';

    const v=sample.verdict||'—';
    const badge=document.getElementById('verdictBadge');
    badge.textContent=v;
    badge.className='badge '+badgeClass(v);
    document.getElementById('scoreText').textContent=
      `综合分 ${sample.final_score ?? '—'} · 置信度 ${sample.confidence ?? '—'}% · 应期支 ${(sample.yingqi_branches||[]).slice(0,6).join('、')||'—'}`;

    const tags=extractTags(sample.pattern_tags);
    document.getElementById('tagBox').innerHTML=tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')||'<span class="tag">—</span>';

    const h=sample.human||{};
    const paras=(h.body&&h.body.length)?h.body:[h.lead||h.plain_summary||''].filter(Boolean);
    document.getElementById('humanHeadline').textContent=h.headline||h.lead||'—';
    document.getElementById('humanPlain').innerHTML=paras.map(p=>`<div style="margin:0 0 12px">${escapeHtml(p)}</div>`).join('');
    document.getElementById('humanMeaning').textContent=h.what_it_means||'';
    document.getElementById('humanTiming').textContent=h.timing_plain||sample.yingqi||'';
    document.getElementById('humanAdvice').innerHTML=(h.advice||[]).map(a=>`<li>${escapeHtml(a)}</li>`).join('')||'<li>先观察关键节点</li>';
    document.getElementById('humanCaveat').textContent=h.caveat||'';

    // 推演过程：优先用 process（叙述体），没有再退回 chain 标签行
    const chain=document.getElementById('chainBox');
    chain.innerHTML='';
    const process=(h.process&&h.process.length)?h.process:null;
    if(process){
      process.forEach((s,i)=>{
        const div=document.createElement('div');
        div.className='step'+(s.label==='综合'?' synthesis':'');
        div.innerHTML=`<div class="idx">${String(i+1).padStart(2,'0')}</div>
          <div class="lab">${escapeHtml(s.label)}</div>
          <p>${escapeHtml(s.text||'')}</p>`;
        chain.appendChild(div);
      });
    } else {
      chainSteps(sample).forEach((s,i)=>{
        if(s.lab==='格局'||s.lab==='格局要点') return;
        const div=document.createElement('div');
        div.className='step '+ (s.kind||'');
        div.innerHTML=`<div class="idx">${String(i+1).padStart(2,'0')}</div>
          <div class="lab">${escapeHtml(s.lab)}</div>
          <p>${escapeHtml(s.body||'')}</p>`;
        chain.appendChild(div);
      });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // chips
  const chips=document.getElementById('caseChips');
  samples.forEach(s=>{
    const b=document.createElement('button');
    b.className='chip';
    b.dataset.id=s.id;
    b.setAttribute('role','tab');
    b.innerHTML=`${s.id}<span class="v">${escapeHtml(s.verdict||'')}</span>`;
    b.onclick=()=>render(s);
    chips.appendChild(b);
  });

  // blind board —— 分数全部来自 evaluate.py 落盘的评测结果，页面不再自带常量
  const blind=data.blind||{};
  const fmt=v=>v==null?'—':Number(v).toFixed(1);
  document.getElementById('portalVersion').textContent=data.version||'—';
  document.getElementById('avgScore').textContent=fmt(blind.headline)+'%';
  document.getElementById('avgScope').textContent=
    blind.headline_n?`（${blind.headline_split} n=${blind.headline_n}）`:'';
  document.getElementById('blindNote').textContent=blind.note||'';
  document.getElementById('metricNote').textContent=
    `指标说明：${blind.metric||''}。${blind.note||''}`;
  const yq=blind.yingqi||{};
  document.getElementById('yingqiStat').textContent=
    yq.top1==null?'':`应期判别力：主应期命中 ${fmt(yq.top1)}%（随机基线 8.3%）· `
      +`基准应支平均名次 ${yq.avg_rank??'—'}/12 · `
      +`候选 ${yq.set_size??'—'}/12 支（随机全覆盖期望 ${fmt(yq.random_expectancy)}%）· n=${yq.n??'—'}`;
  const hist=document.getElementById('blindHist');
  (blind.history||[]).forEach(h=>{
    const col=document.createElement('div');
    col.className='col';
    const hgt=Math.max(4, Number(h.avg||0));
    col.innerHTML=`<div class="val">${Number(h.avg).toFixed(1)}%</div><div class="barh" style="height:${hgt}%"></div><div class="lbl">${escapeHtml(h.label)}</div>`;
    hist.appendChild(col);
  });
  const grid=document.getElementById('blindGrid');
  const tune=blind.tune||{};
  (tune.scores||[]).forEach((sc,i)=>{
    const cell=document.createElement('div');
    cell.className='bcell';
    cell.innerHTML=`<div class="id">${escapeHtml((tune.ids||[])[i]||'#'+(i+1))}</div><div class="sc">${sc}</div>`;
    grid.appendChild(cell);
  });

  // actions
  document.getElementById('btnExport').onclick=()=>{
    if(!current) return;
    // 优先使用已生成的完整报告文件名提示；同时生成一份轻量 HTML
    const html=buildLightHtml(current);
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`六爻报告_${current.id||'case'}.html`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  document.getElementById('btnOpenSample').onclick=()=>{
    if(!current) return;
    // 不再 window.open 一个需要预先落盘的静态文件名（上一版就是这么指到已不存在的
    // sample_report_ZS001.html，点开来是死链）；直接用页内数据开新窗口
    const w=window.open('','_blank');
    if(!w) return;
    w.document.write(buildLightHtml(current));
    w.document.close();
  };
  document.getElementById('btnCopyHuman').onclick=async()=>{
    const h=(current&&current.human)||{};
    const text=[
      h.headline||'',
      h.plain_summary||'',
      '更直白一点：'+(h.what_it_means||''),
      '时间节奏：'+(h.timing_plain||''),
      '建议：',
      ...(h.advice||[]).map((a,i)=>`${i+1}. ${a}`),
      h.caveat||''
    ].filter(Boolean).join('\n');
    try{ await navigator.clipboard.writeText(text); alert('已复制解读'); }
    catch(e){ alert('复制失败，请手动选择文本'); }
  };

  function buildLightHtml(s){
    const h=s.human||{};
    const paras=(h.body&&h.body.length)?h.body:[h.lead||h.plain_summary||''].filter(Boolean);
    const advice=(h.advice||[]).map(a=>`<li>${escapeHtml(a)}</li>`).join('');
    const bodyHtml=paras.map(p=>`<p>${escapeHtml(p)}</p>`).join('');
    const process=(h.process||[]).map(p=>`<li><b>${escapeHtml(p.label||'')}</b>：${escapeHtml(p.text||'')}</li>`).join('');
    return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><title>${escapeHtml(h.title||s.id||'六爻报告')}</title>
<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#F6F1E7;color:#1C1917;padding:32px;line-height:1.8}
.wrap{max-width:820px;margin:0 auto;background:#FFFBF3;border:1px solid #D9CFBC;border-radius:12px;padding:28px}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:24px;margin-bottom:8px}
.meta{color:#8A8175;font-size:13px;margin-bottom:16px}
.caveat{margin-top:20px;font-size:12px;color:#8A8175;border-top:1px dashed #D9CFBC;padding-top:10px}
details{margin-top:18px;font-size:13px;color:#4a433a}</style></head>
<body><div class="wrap">
<h1>${escapeHtml(h.title||h.headline||s.question||'六爻报告')}</h1>
<div class="meta">${escapeHtml(s.id||'')} · ${escapeHtml(s.hexagram||'')}${s.changed?' → '+escapeHtml(s.changed):''} · ${escapeHtml(s.verdict||'')}</div>
${bodyHtml}
<p><b>时间上：</b>${escapeHtml(h.timing_plain||'')}</p>
<p><b>可以这样做：</b></p><ul>${advice}</ul>
${process?`<details><summary>推演过程（备查）</summary><ol>${process}</ol></details>`:''}
<div class="caveat">${escapeHtml(h.caveat||'')}</div>
</div></body></html>`;
  }

  render(samples[0]);
})();
</script>
</body>
</html>
